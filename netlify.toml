[build]
  publish = "dist"
  command = "npm run build"

[[redirects]]
  from = "/publicaciones-facl/*"
  to = "/publicaciones-facl/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
