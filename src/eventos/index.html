<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eventos | FACL</title>
  <meta name="description" content="Próximos eventos y actividades del Foro Argentino del Campo Lacaniano. Simposios, encuentros y jornadas programadas.">
  <meta property="og:title" content="Eventos | FACL">
  <meta property="og:description" content="Próximos eventos y actividades del Foro Argentino del Campo Lacaniano. Simposios, encuentros y jornadas programadas.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://campolacanianoarg.org/eventos">
  <meta property="og:image" content="https://campolacanianoarg.org/assets/images/evento-simposio.png">
  <link rel="canonical" href="https://campolacanianoarg.org/eventos">
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/components/navbar.css">
  <link rel="stylesheet" href="/css/components/footer.css">
  <link rel="stylesheet" href="/css/components/loading.css">
  <link rel="stylesheet" href="/css/components/card-publicacion.css">
  <link rel="stylesheet" href="/css/pages/eventos.css">
</head>
<body>
  <main>
    <section class="eventos-main" aria-label="Próximos eventos">
      <div class="eventos-main__inner">
        <header class="eventos-hero">
          <img
            class="eventos-hero__mark"
            src="/assets/images/footer-mark.svg"
            alt=""
            aria-hidden="true"
            width="99"
            height="102"
            decoding="async"
          >
          <h2 class="eventos-hero__title">Nuestros próximos eventos</h2>
          <p class="eventos-hero__subtitle">
            Descubre nuestros próximos eventos y actividades programadas.
          </p>
        </header>

        <div
          class="eventos-grid"
          id="eventos-grid"
          aria-live="polite"
          aria-busy="true"
          aria-label="Listado de eventos"
        ></div>
      </div>
    </section>

    <section class="eventos-instagram-cta" aria-label="Seguir actualizaciones en Instagram">
      <div class="eventos-instagram-cta__bg" aria-hidden="true">
        <img
          src="/assets/images/cta-banner.png"
          alt=""
          width="1440"
          height="408"
          loading="lazy"
          decoding="async"
        >
      </div>
      <div class="eventos-instagram-cta__inner">
        <h2 class="eventos-instagram-cta__title">SEGUÍ NUESTRAS ACTUALIZACIONES</h2>
        <p class="eventos-instagram-cta__text">
          Si querés enterarte de todas las actividades presenciales y/o digitales del Foro,
          seguinos en nuestras redes sociales y activá las notificaciones.
        </p>
        <a href="#" class="btn btn-primary eventos-instagram-cta__cta">Ver instagram</a>
      </div>
    </section>
  </main>

  <script type="module" src="/js/pages/eventos.js"></script>
</body>
</html>
